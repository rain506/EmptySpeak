<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empty Speak - Edge TTS Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0a0a0c',
                            card: '#121216',
                            border: '#22222c',
                            hover: '#1a1a22'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans Myanmar', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-dark-bg text-gray-100 font-sans min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation -->
    <header class="border-b border-dark-border bg-dark-card/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i data-lucide="mic" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-tight flex items-center gap-2">
                        Empty Speak
                        <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-semibold">Pro TTS</span>
                    </h1>
                    <p class="text-xs text-gray-400">Microsoft Edge Neural Voice Studio</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- API Status Badge -->
                <div id="api-status" class="hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="status-text">Backend Connected</span>
                </div>

                <!-- Theme Toggle -->
                <button id="theme-toggle" class="p-2 rounded-lg bg-dark-card border border-dark-border hover:bg-dark-hover text-gray-300 transition-colors">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Input & Voice Selection (7 Cols) -->
        <div class="lg:col-span-7 flex flex-col space-y-6">
            
            <!-- Text Input Card -->
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 flex flex-col shadow-xl">
                <div class="flex items-center justify-between mb-3">
                    <label for="tts-text" class="text-sm font-semibold text-gray-300 flex items-center gap-2">
                        <i data-lucide="file-text" class="w-4 h-4 text-indigo-400"></i>
                        Input Text (Myanmar & English)
                    </label>
                    <div class="flex items-center space-x-2 text-xs text-gray-400">
                        <span id="char-count">0</span> characters
                    </div>
                </div>

                <textarea id="tts-text" rows="6" 
                    class="w-full bg-dark-bg border border-dark-border rounded-xl p-4 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-indigo-500/50 focus:ring-2 focus:ring-indigo-500/20 transition-all text-sm leading-relaxed resize-none"
                    placeholder="မင်္ဂလာပါ၊ Empty Speak မှ ကြိုဆိုပါတယ်။ Enter text in Myanmar or English here..."></textarea>

                <div class="flex items-center justify-between mt-3 pt-3 border-t border-dark-border/60">
                    <div class="flex items-center space-x-2">
                        <button onclick="insertSample('mm')" class="text-xs px-2.5 py-1 rounded-lg bg-dark-bg border border-dark-border text-gray-300 hover:border-indigo-500/40 transition-all">🇲🇲 မြန်မာ နမူနာ</button>
                        <button onclick="insertSample('en')" class="text-xs px-2.5 py-1 rounded-lg bg-dark-bg border border-dark-border text-gray-300 hover:border-indigo-500/40 transition-all">🇺🇸 English Sample</button>
                    </div>
                    <button onclick="clearText()" class="text-xs text-gray-400 hover:text-red-400 transition-colors flex items-center gap-1">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Clear
                    </button>
                </div>
            </div>

            <!-- Voice Selection Card -->
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 flex flex-col shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <label class="text-sm font-semibold text-gray-300 flex items-center gap-2">
                        <i data-lucide="users" class="w-4 h-4 text-indigo-400"></i>
                        Select Neural Voice
                    </label>
                    <div class="relative w-48">
                        <input type="text" id="voice-search" placeholder="Search voices..." 
                            class="w-full bg-dark-bg border border-dark-border rounded-lg px-3 py-1.5 text-xs text-gray-300 placeholder-gray-500 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <!-- Region Filter Tabs -->
                <div class="flex space-x-2 mb-3 border-b border-dark-border pb-3">
                    <button onclick="filterVoices('all')" class="voice-tab px-3 py-1 rounded-lg text-xs font-medium bg-indigo-600 text-white transition-all" data-region="all">All Voices</button>
                    <button onclick="filterVoices('mm')" class="voice-tab px-3 py-1 rounded-lg text-xs font-medium bg-dark-bg text-gray-400 hover:text-white transition-all" data-region="mm">🇲🇲 Myanmar</button>
                    <button onclick="filterVoices('us')" class="voice-tab px-3 py-1 rounded-lg text-xs font-medium bg-dark-bg text-gray-400 hover:text-white transition-all" data-region="us">🇺🇸 US English</button>
                    <button onclick="filterVoices('gb')" class="voice-tab px-3 py-1 rounded-lg text-xs font-medium bg-dark-bg text-gray-400 hover:text-white transition-all" data-region="gb">🇬🇧 UK English</button>
                </div>

                <!-- Voice List Container -->
                <div id="voice-list" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>

        </div>

        <!-- Right Column: Controls & Player (5 Cols) -->
        <div class="lg:col-span-5 flex flex-col space-y-6">
            
            <!-- Voice Parameter Settings -->
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 flex flex-col shadow-xl space-y-5">
                <h2 class="text-sm font-semibold text-gray-300 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i>
                    Speech Parameters
                </h2>

                <!-- Speed / Rate -->
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-400">Speed (Rate)</span>
                        <span id="rate-val" class="font-mono text-indigo-400">+0%</span>
                    </div>
                    <input type="range" id="rate-range" min="-50" max="100" value="0" step="5" 
                        class="w-full accent-indigo-600 bg-dark-bg rounded-lg cursor-pointer h-1.5">
                </div>

                <!-- Pitch -->
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-400">Pitch</span>
                        <span id="pitch-val" class="font-mono text-indigo-400">+0Hz</span>
                    </div>
                    <input type="range" id="pitch-range" min="-20" max="20" value="0" step="1" 
                        class="w-full accent-indigo-600 bg-dark-bg rounded-lg cursor-pointer h-1.5">
                </div>

                <!-- Volume -->
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-400">Volume</span>
                        <span id="volume-val" class="font-mono text-indigo-400">+0%</span>
                    </div>
                    <input type="range" id="volume-range" min="-50" max="50" value="0" step="5" 
                        class="w-full accent-indigo-600 bg-dark-bg rounded-lg cursor-pointer h-1.5">
                </div>
            </div>

            <!-- Generate & Player Output Card -->
            <div class="bg-dark-card border border-dark-border rounded-2xl p-5 flex flex-col shadow-xl space-y-4">
                <button id="generate-btn" onclick="generateSpeech()" 
                    class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2 transition-all active:scale-[0.99]">
                    <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                    Generate Speech
                </button>

                <!-- Audio Visualizer / Player Container -->
                <div id="player-container" class="hidden flex flex-col space-y-3 pt-3 border-t border-dark-border">
                    <div class="h-12 bg-dark-bg rounded-xl border border-dark-border flex items-center px-4 justify-between">
                        <div class="flex items-center space-x-3">
                            <button id="play-pause-btn" onclick="togglePlayAudio()" class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center hover:bg-indigo-500 transition-colors">
                                <i data-lucide="pause" class="w-4 h-4"></i>
                            </button>
                            <span id="audio-time" class="text-xs font-mono text-gray-400">0:00 / 0:00</span>
                        </div>
                        <a id="download-btn" href="#" download="empty-speak-audio.mp3" class="text-xs flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-dark-bg border border-dark-border hover:border-indigo-500 text-gray-300 transition-colors">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i> Download MP3
                        </a>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- JavaScript Application Logic -->
    <script>
        lucide.createIcons();

        // Voices Dataset
        const voices = [
            { id: 'my-MM-NilarNeural', name: 'Nilar (Neural)', region: 'mm', gender: 'Female' },
            { id: 'my-MM-ThihaNeural', name: 'Thiha (Neural)', region: 'mm', gender: 'Male' },
            { id: 'en-US-AriaNeural', name: 'Aria (US)', region: 'us', gender: 'Female' },
            { id: 'en-US-GuyNeural', name: 'Guy (US)', region: 'us', gender: 'Male' },
            { id: 'en-US-JennyNeural', name: 'Jenny (US)', region: 'us', gender: 'Female' },
            { id: 'en-US-SteffanNeural', name: 'Steffan (US)', region: 'us', gender: 'Male' },
            { id: 'en-GB-SoniaNeural', name: 'Sonia (UK)', region: 'gb', gender: 'Female' },
            { id: 'en-GB-RyanNeural', name: 'Ryan (UK)', region: 'gb', gender: 'Male' },
            { id: 'en-GB-LibbyNeural', name: 'Libby (UK)', region: 'gb', gender: 'Female' }
        ];

        let selectedVoice = 'my-MM-NilarNeural';
        let currentAudio = null;

        // Render Voices
        function renderVoices(filter = 'all', search = '') {
            const list = document.getElementById('voice-list');
            list.innerHTML = '';

            const filtered = voices.filter(v => {
                const matchRegion = filter === 'all' || v.region === filter;
                const matchSearch = v.name.toLowerCase().includes(search.toLowerCase()) || v.id.toLowerCase().includes(search.toLowerCase());
                return matchRegion && matchSearch;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div class="text-xs text-gray-500 text-center py-4">No voices found</div>';
                return;
            }

            filtered.forEach(v => {
                const isSelected = v.id === selectedVoice;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-2.5 rounded-xl border cursor-pointer transition-all ${isSelected ? 'bg-indigo-600/10 border-indigo-500/50 text-white' : 'bg-dark-bg border-dark-border text-gray-300 hover:border-gray-700'}`;
                div.onclick = () => { selectedVoice = v.id; renderVoices(currentFilter, document.getElementById('voice-search').value); };
                
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-7 h-7 rounded-lg ${isSelected ? 'bg-indigo-600 text-white' : 'bg-dark-card text-gray-400'} flex items-center justify-center text-xs font-bold">
                            ${v.region.toUpperCase()}
                        </div>
                        <div>
                            <div class="text-xs font-semibold">${v.name}</div>
                            <div class="text-[10px] text-gray-500">${v.id}</div>
                        </div>
                    </div>
                    <span class="text-[10px] px-2 py-0.5 rounded bg-dark-card border border-dark-border text-gray-400">${v.gender}</span>
                `;
                list.appendChild(div);
            });
        }

        let currentFilter = 'all';
        function filterVoices(region) {
            currentFilter = region;
            document.querySelectorAll('.voice-tab').forEach(btn => {
                if (btn.dataset.region === region) {
                    btn.className = 'voice-tab px-3 py-1 rounded-lg text-xs font-medium bg-indigo-600 text-white transition-all';
                } else {
                    btn.className = 'voice-tab px-3 py-1 rounded-lg text-xs font-medium bg-dark-bg text-gray-400 hover:text-white transition-all';
                }
            });
            renderVoices(region, document.getElementById('voice-search').value);
        }

        document.getElementById('voice-search').addEventListener('input', (e) => {
            renderVoices(currentFilter, e.target.value);
        });

        // Sliders update listeners
        ['rate', 'pitch', 'volume'].forEach(param => {
            const slider = document.getElementById(`${param}-range`);
            const valDisplay = document.getElementById(`${param}-val`);
            slider.addEventListener('input', (e) => {
                const val = e.target.value;
                valDisplay.textContent = (val > 0 ? '+' : '') + val + (param === 'pitch' ? 'Hz' : '%');
            });
        });

        // Textarea character count
        const textarea = document.getElementById('tts-text');
        textarea.addEventListener('input', (e) => {
            document.getElementById('char-count').textContent = e.target.value.length;
        });

        function insertSample(type) {
            if (type === 'mm') {
                textarea.value = "မင်္ဂလာပါ၊ Empty Speak မှ ကြိုဆိုပါတယ်။ ဤစနစ်သည် Microsoft Edge TTS ကို အသုံးပြုထားပါသည်။";
            } else {
                textarea.value = "Welcome to Empty Speak. This application uses high quality Microsoft Edge neural voices.";
            }
            document.getElementById('char-count').textContent = textarea.value.length;
        }

        function clearText() {
            textarea.value = '';
            document.getElementById('char-count').textContent = '0';
        }

        // Theme Toggle
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Generate Speech API Request
        async function generateSpeech() {
            const text = textarea.value.trim();
            if (!text) {
                alert('ကျေးဇူးပြု၍ စာသားအနည်းဆုံး တစ်ခုခု ရိုက်ထည့်ပါ။');
                return;
            }

            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Generating Audio...`;

            const rate = document.getElementById('rate-range').value + '%';
            const pitch = document.getElementById('pitch-range').value + 'Hz';
            const volume = document.getElementById('volume-range').value + '%';

            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voice: selectedVoice, rate, pitch, volume })
                });

                if (!response.ok) throw new Error('Failed to generate speech');

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);

                if (currentAudio) currentAudio.pause();
                currentAudio = new Audio(audioUrl);
                
                document.getElementById('player-container').classList.remove('hidden');
                document.getElementById('download-btn').href = audioUrl;
                
                currentAudio.play();
                currentAudio.onended = () => {
                    document.getElementById('play-pause-btn').innerHTML = '<i data-lucide="play" class="w-4 h-4"></i>';
                    lucide.createIcons();
                };

                document.getElementById('play-pause-btn').innerHTML = '<i data-lucide="pause" class="w-4 h-4"></i>';
                lucide.createIcons();

            } catch (err) {
                alert('Connection Error: Server သို့ ချိတ်ဆက်၍မရပါ။ Python server.py ကို Run ထားခြင်း ရှိမရှိ စစ်ဆေးပါ။');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="play" class="w-4 h-4 fill-current"></i> Generate Speech`;
                lucide.createIcons();
            }
        }

        function togglePlayAudio() {
            if (!currentAudio) return;
            const btn = document.getElementById('play-pause-btn');
            if (currentAudio.paused) {
                currentAudio.play();
                btn.innerHTML = '<i data-lucide="pause" class="w-4 h-4"></i>';
            } else {
                currentAudio.pause();
                btn.innerHTML = '<i data-lucide="play" class="w-4 h-4"></i>';
            }
            lucide.createIcons();
        }

        // Initial Render
        renderVoices();
    </script>
</body>
</html>
